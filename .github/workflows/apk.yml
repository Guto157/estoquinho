name: Gerar APK AdMob
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Preparar www
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp agiota.png www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
      - run: npm init -y
      - run: npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/admob
      - run: npx cap init "Pega1Paga2" com.guto157.estoquinho --web-dir=www
      - run: npx cap add android
      - run: npx cap copy android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Limpar cache Gradle
        run: rm -rf ~/.gradle/caches
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew clean assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-com-admob
          path: android/app/build/outputs/apk/debug/app-debug.apk

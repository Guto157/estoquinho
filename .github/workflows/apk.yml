name: Gerar APK AdMob
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/admob
      - run: npx cap init "Pega1Paga2" com.guto157.estoquinho --web-dir=.
      - run: npx cap add android
      - run: npx cap copy android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-com-admob
          path: android/app/build/outputs/apk/debug/app-debug.apk

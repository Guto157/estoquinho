name: Gerar APK AdMob
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor-community/admob
      - run: npx cap init "Pega1Paga2" com.guto157.estoquinho --web-dir=.
      - run: npx cap add android
      - run: |
          echo "APP_ID=ca-app-pub-565976483764863~1718924622
          AD_UNIT=ca-app-pub-565976483764863/4493969614" > .env
      - run: npx cap copy android
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v3
        with:
          name: apk-com-admob
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Gerar APK AdMob
on: 
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar www
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp agiota.png www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true

      - name: Instalar Capacitor 5
        run: |
          npm init -y
          npm install @capacitor/cli@5 @capacitor/core@5 @capacitor/android@5 @capacitor-community/admob@5

      - name: Iniciar projeto
        run: npx cap init "Pega1Paga2" com.guto157.estoquinho --web-dir=www

      - name: Add Android
        run: npx cap add android

      - name: Copiar web
        run: npx cap copy android

      - name: Limpar cache
        run: |
          rm -rf ~/.gradle/caches/jars-9
          rm -rf ~/.gradle/caches/modules-2

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-com-admob
          path: android/app/build/outputs/apk/debug/app-debug.apk

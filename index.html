<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEGA 1 PAGA 2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui} body{background:#000;display:flex;justify-content:center}
#game{width:100%;max-width:440px;background:#FFFBEA;min-height:100vh;display:flex;flex-direction:column}
header{background:#111;color:#FFD600;padding:12px;display:flex;justify-content:space-between}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:8px;background:#222}
.hud div{background:#111;border-radius:10px;padding:7px;color:#fff;text-align:center;font-size:11px} .hud b{display:block}
#palco{padding:12px;text-align:center}
#cliente{width:86px;height:86px;background:#fff;border:3px solid #111;border-radius:50%;font-size:42px;display:flex;align-items:center;justify-content:center;margin:auto}
#bubble{background:#111;color:#fff;padding:12px;border-radius:14px;margin:10px auto;text-align:left;font-size:14px}
#info{background:#fff;border:2.5px solid #111;border-radius:12px;padding:12px;text-align:left}
.btn{width:100%;padding:14px;border-radius:12px;border:3px solid #111;font-weight:900;font-size:13px;margin-top:8px;text-align:left;cursor:pointer}
.verde{background:#00E676}.amarelo{background:#FFD600}.branco{background:#fff}.preto{background:#111;color:#FFD600}
#log{font-size:11px;color:#666;margin-top:10px;height:80px;overflow:auto}
</style>
</head><body>
<div id="game">
<header><b>PEGA 1 PAGA 2 💰</b><div>DIA <span id="day">1</span></div></header>
<div class="hud">
<div>CAIXA<b id="money" style="color:#00FF88">R$500</b></div>
<div>DÓLAR<b>💲0</b></div>
<div style="background:#FFD600;color:#111">BANCO</div>
<div>TÍTULO<b style="font-size:9px">MOLEQUE</b></div>
</div>
<div id="palco">
<div id="cliente">💈</div>
<div id="bubble">...</div>
<div id="info">
<h3><span id="nome"></span> <span id="tag" style="padding:4px 8px;border-radius:20px;font-size:11px;color:#111;font-weight:900"></span></h3>
<p id="hist"></p>
<div style="display:flex;gap:6px;margin-top:8px">
<div style="flex:1;background:#FFF3B0;padding:6px;border-radius:8px;text-align:center;font-size:11px">PEDE<b id="pede" style="display:block"></b></div>
<div style="flex:1;background:#FFF3B0;padding:6px;border-radius:8px;text-align:center;font-size:11px">VOLTA<b id="volta" style="display:block"></b></div>
<div style="flex:1;background:#FFF3B0;padding:6px;border-radius:8px;text-align:center;font-size:11px">CHANCE<b id="chance" style="display:block"></b></div>
</div>
</div>
<div id="choices"></div>
<div id="log"></div>
</div>
</div>

<script>
let day=1,money=500;
let usado={};
const personagens=[
{n:"Beto",e:"👷",r:"BAIXO",c:88,p:50,d:100,h:["Mulher no hospital"]},
{n:"Tia Coxinha",e:"👩‍🍳",r:"BAIXO",c:82,p:70,d:130,h:["Geladeira queimou"]},
{n:"Nego do Corte",e:"💈",r:"ALTO",c:38,p:200,d:600,h:["Máquina quebrou"]},
{n:"Jéssica Nail",e:"💅",r:"MÉDIO",c:62,p:90,d:200,h:["Cliente grande"]},
{n:"Magrão 12",e:"😎",r:"MÉDIO",c:55,p:120,d:300,h:["Baile vai lotar"]}
];
let cur;
function novo(){
let disp=personagens.filter(p=>!usado[p.n]||usado[p.n]<3);
if(disp.length==0){usado={};disp=personagens}
cur=disp[Math.floor(Math.random()*disp.length)];
usado[cur.n]=(usado[cur.n]||0)+1;
document.getElementById('cliente').innerText=cur.e;
document.getElementById('nome').innerText=cur.n;
document.getElementById('tag').innerText=cur.r;
document.getElementById('tag').style.background=cur.r=='BAIXO'?'#00E676':cur.r=='MÉDIO'?'#FFD600':'#FF5252';
document.getElementById('hist').innerText=cur.h[0];
document.getElementById('bubble').innerText=cur.n+': "Preciso de ajuda"';
document.getElementById('pede').innerText='R$'+cur.p;
document.getElementById('volta').innerText='R$'+(cur.p*2);
document.getElementById('chance').innerText=cur.c+'%';

let div=document.getElementById('choices');
div.innerHTML='';
// CORREÇÃO: Se cliente pede 100, botão será RECEBER 200 (dobro do pedido)
let valorPedido = cur.p; // ex: 100
let valorReceber = valorPedido * 2; // ex: 200

[
{t:`💰 RECEBER ${valorReceber}`,c:'amarelo',a:'normal',pede:valorPedido,recebe:valorReceber},
{t:`❌ NEGAR`,c:'branco',a:'negar'},
{t:`😈 JUROS R$${valorReceber+150}`,c:'preto',a:'juros'}
].forEach(o=>{
let b=document.createElement('button');
b.className='btn '+o.c;
b.innerText=o.t;
b.onclick=()=>jogar(o.a,o.pede,o.recebe);
div.appendChild(b);
});
}

function jogar(tipo,pede,recebe){
if(tipo=='negar'){log('Negou '+cur.n);day++;novo();return}
let pe=pede;
let de=recebe;
if(tipo=='juros'){de=recebe+150}
let pagou=Math.random()*100 < cur.c;
if(pagou){
money+=(de-pe);
log(`✅ ${cur.n} pediu ${pe} pagou ${de} lucro ${de-pe}`);
day++;
novo();
}else{
money-=Math.floor(pe*0.5);
log(`💀 ${cur.n} CALOTE de R$${pe}`);
day++;
novo();
}
document.getElementById('day').innerText=day;
document.getElementById('money').innerText='R$'+money;
}

function log(t){document.getElementById('log').innerHTML='> '+t+'<br>'+document.getElementById('log').innerHTML}
novo();
</script>
</body></html>

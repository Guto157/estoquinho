<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEGA 1 PAGA 2</title>
<style>body{margin:0;background:#000;display:flex;justify-content:center}#game{width:100%;max-width:440px;background:#FFFBEA;min-height:100vh;display:flex;flex-direction:column;font-family:system-ui}header{background:#111;color:#FFD600;padding:12px;display:flex;justify-content:space-between}.hud{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:8px;background:#222}.hud div{background:#111;border-radius:10px;padding:7px;color:#fff;text-align:center;font-size:11px}.btn{width:100%;padding:14px;border-radius:12px;border:3px solid #111;font-weight:900;margin-top:8px;cursor:pointer}.amarelo{background:#FFD600}.verde{background:#00E676}.branco{background:#fff}.preto{background:#111;color:#FFD600}.roxo{background:#B388FF}.azul{background:#40C4FF}.modal{position:fixed;inset:0;background:#000c;z-index:30;padding:14px;display:none;align-items:center;justify-content:center}.box{background:#FFFBEA;border:3px solid #111;border-radius:16px;padding:16px;max-width:420px;width:100%}.card{background:#fff;border:2px solid #111;border-radius:12px;padding:12px;margin-bottom:8px}input{width:100%;padding:12px;border:3px solid #111;border-radius:12px;font-weight:700;margin-top:8px}</style>
</head>
<body>
<div id="game">
<header><b>PEGA 1 PAGA 2 💰</b><span style="font-size:10px;color:#aaa">DIA <span id="day">1</span> LVL <span id="lvl">1</span></span></header>
<div class="hud"><div>CAIXA<b id="money">R$500</b></div><div>DOLAR<b id="dolar">0</b></div><div onclick="openBanco()">BANCO</div><div onclick="openTitulos()">TITULO<b id="patrao"></b></div></div>
<div style="padding:12px;text-align:center">
<div id="bubble" style="background:#111;color:#fff;padding:12px;border-radius:12px;text-align:left">...</div>
<div id="info" style="background:#fff;border:2px solid #111;border-radius:12px;padding:12px;margin-top:10px;text-align:left"><h3><span id="nome"></span> <span id="tag"></span></h3><p id="hist"></p><div style="display:flex;gap:6px;margin-top:8px"><div style="flex:1;background:#FFF3B0;padding:6px;border-radius:8px;text-align:center">PEDE<b id="pede"></b></div><div style="flex:1;background:#FFF3B0;padding:6px;border-radius:8px;text-align:center">VOLTA<b id="volta"></b></div><div style="flex:1;background:#FFF3B0;padding:6px;border-radius:8px;text-align:center">CHANCE<b id="chance"></b></div></div></div>
<div id="choices"></div>
<div id="areaColeta"></div>
</div>
<div id="loginModal" class="modal" style="display:flex"><div class="box"><h2>📱 LOGIN</h2><input id="loginPhone" type="tel" placeholder="(11) 99999-9999"><div id="areaCodigo" style="display:none"><input id="loginCodigo" placeholder="Codigo 6 digitos"><div id="codigoStatus" style="background:#111;color:#FFD600;padding:8px;border-radius:8px;margin-top:6px;font-size:11px;display:none"></div></div><button id="btnEnviar" class="btn azul" onclick="solicitarCodigo()">📲 ENVIAR CODIGO SMS REAL</button><button id="btnEntrar" class="btn amarelo" style="display:none" onclick="confirmarCodigo()">✅ CONFIRMAR E ENTRAR</button></div></div>
<div id="bancoModal" class="modal"><div class="box"><h2>BANCO</h2><div class="card"><b>R$100</b><button class="btn verde" onclick="pedirBanco(100,5)">+R$100</button></div><div class="card"><b>R$200</b><button class="btn verde" onclick="pedirBanco(200,10)">+R$200</button></div><button class="btn branco" onclick="closeAll()">FECHAR</button></div></div>
<div id="shopModal" class="modal"><div class="box"><div id="shopList"></div><button class="btn branco" onclick="closeAll()">FECHAR</button></div></div>
<div id="missoesModal" class="modal"><div class="box"><div id="listaMissoes"></div><button class="btn branco" onclick="closeAll()">FECHAR</button></div></div>
<div id="desafiosModal" class="modal"><div class="box"><div id="listaDesafios"></div><button class="btn branco" onclick="closeAll()">FECHAR</button></div></div>
<div id="titulosModal" class="modal"><div class="box"><div id="listaTitulos"></div><button class="btn branco" onclick="closeAll()">FECHAR</button></div></div>
<div id="pixModal" class="modal"><div class="box"><button class="btn branco" onclick="closeAll()">FECHAR</button></div></div>
<div id="adSave" class="modal"><div class="box" style="text-align:center"><h2>CALOTE!</h2><p id="adText"></p><button class="btn amarelo" onclick="salvarComAnuncio()">SALVAR</button><button class="btn branco" onclick="aceitarPerda()">ACEITAR</button></div></div>
<div id="adModal" class="modal"><div class="box" style="text-align:center"><p id="adTimer"></p><button id="btnClaim" class="btn verde" style="display:none" onclick="recompensaLiberada()">PEGAR</button></div></div>
<div id="gameOver" class="modal"><div class="box" style="text-align:center"><h2>FALIDO!</h2><button class="btn amarelo" onclick="resetGameOver()">R$300</button><button class="btn branco" onclick="restartFull()">RECOMEÇAR</button></div></div>
</div>
<script>
// === TROCA AQUI SEU SID E TOKEN DA TWILIO ===
const TWILIO_SID = "ACf90fccd59588adf8f119c4faae7d935d";
const TWILIO_TOKEN = "0ceac53959e2e3b8d85e9935c85fb88e";
const TWILIO_FROM = "+17372508034";

let currentUser=null,codigoAtual=null,day=1,money=500,fame=1,level=1,dolar=0,inv=[],pendentePerda=0,pendenteTipo=null,pendenteBanco=0,usado={},totalEmp=0,totalLucro=0,seq=0,jurosCount=0,pagarCount=0,desafiosProg={},missaoParaColetar=[],desafiosParaColetar=[];
const titulos=[{l:1,n:"MOLEQUE"},{l:5,n:"FREGUÊS"},{l:10,n:"PATRÃO"},{l:20,n:"DONO DA LAJE"},{l:35,n:"REI DA QUEBRADA"},{l:50,n:"PATRÃO DA FAVELA"},{l:75,n:"DONO DA BOCA"},{l:100,n:"CHEFÃO"},{l:150,n:"SENHOR DO MORRO"},{l:200,n:"BARÃO DO CRIME"}];
function getTitulo(lvl){let t="MOLEQUE";for(let x of titulos){if(lvl>=x.l)t=x.n;}return t;}
let todasMissoes=[],todosDesafios=[],ativasMissoes=[],ativasDesafios=[],proxMissaoIdx=0,proxDesafioIdx=0;
const personagens=[{n:"Beto da Laje",sig:"BL",cor:"#4A90E2",r:"BAIXO",c:88,p:50,h:["Mulher no hospital"]},{n:"Tia Coxinha",sig:"TC",cor:"#E27A4A",r:"BAIXO",c:82,p:70,h:["Geladeira"]},{n:"Nego do Corte",sig:"NC",cor:"#111",r:"ALTO",c:38,p:200,h:["Maquina quebrou"]},{n:"Jéssica Nail",sig:"JN",cor:"#E94AA6",r:"MÉDIO",c:62,p:90,h:["Cliente grande"]}];
let cur;
async function solicitarCodigo(){
 let tel=document.getElementById('loginPhone').value.replace(/\D/g,'');
 if(tel.length<10){alert('Digite telefone com DDD');return;}
 codigoAtual=Math.floor(100000+Math.random()*900000).toString();
 document.getElementById('areaCodigo').style.display='block';
 document.getElementById('codigoStatus').style.display='block';
 document.getElementById('codigoStatus').innerText='⏳ Enviando SMS real para +55'+tel+'...';
 document.getElementById('btnEnviar').disabled=true;
 try{
   const url=`https://api.twilio.com/2010-04-01/Accounts/${TWILIO_SID}/Messages.json`;
   const auth=btoa(TWILIO_SID+':'+TWILIO_TOKEN);
   const dados=new URLSearchParams();
   dados.append('From',TWILIO_FROM);
   dados.append('To','+55'+tel);
   dados.append('Body','PEGA1PAGA2 seu codigo: '+codigoAtual);
   const res=await fetch(url,{method:'POST',headers:{'Authorization':'Basic '+auth,'Content-Type':'application/x-www-form-urlencoded'},body:dados});
   const json=await res.json();
   if(json.sid){document.getElementById('codigoStatus').innerText='✅ SMS ENVIADO! SID: '+json.sid;localStorage.setItem('temp_code_'+tel,codigoAtual);}
   else throw new Error(JSON.stringify(json));
 }catch(e){localStorage.setItem('temp_code_'+tel,codigoAtual);document.getElementById('codigoStatus').innerText='Erro Twilio (se for trial só envia pro seu numero verificado): '+e.message+' | Codigo local: '+codigoAtual;}
 document.getElementById('btnEnviar').style.display='none';document.getElementById('btnEntrar').style.display='block';
}
function confirmarCodigo(){let tel=document.getElementById('loginPhone').value.replace(/\D/g,'');let cod=document.getElementById('loginCodigo').value.trim();let salvo=localStorage.getItem('temp_code_'+tel);if(cod!==codigoAtual&&cod!==salvo){alert('Codigo errado, era '+codigoAtual);return;}currentUser=tel;localStorage.setItem('currentUser',currentUser);document.getElementById('loginModal').style.display='none';localStorage.removeItem('temp_code_'+tel);novo();check();}
function novo(){let disp=personagens;cur=disp[Math.floor(Math.random()*disp.length)];document.getElementById('nome').innerText=cur.n;document.getElementById('tag').innerText=cur.r;document.getElementById('hist').innerText=cur.h[0];document.getElementById('bubble').innerText=cur.n;document.getElementById('pede').innerText='R$'+cur.p;document.getElementById('volta').innerText='R$'+(cur.p*2);document.getElementById('chance').innerText=cur.c+'%';let div=document.getElementById('choices');div.innerHTML='';[{t:'RECEBER R$'+(cur.p*2),c:'amarelo',a:'pagar'},{t:'NEGAR',c:'branco',a:'negar'},{t:'JUROS R$'+Math.floor(cur.p*2.1),c:'preto',a:'juros'}].forEach(o=>{let b=document.createElement('button');b.className='btn '+o.c;b.innerText=o.t;b.onclick=()=>jogar(o.a);div.appendChild(b)});}
function jogar(tipo){if(tipo=='negar'){money-=25;day++;check();novo();return;}let ch=cur.c,de=cur.p*2;if(tipo=='juros')de=Math.floor(cur.p*2.1);let pagou=Math.random()*100<ch;if(pagou){money+=de-cur.p;fame++;day++;check();novo();}else{pendentePerda=cur.p;document.getElementById('adText').innerText=cur.n+' calote R$'+cur.p;document.getElementById('adSave').style.display='flex';}}
function mostrarAnuncio(tipo,tempo){pendenteTipo=tipo;document.getElementById('adModal').style.display='flex';let t=tempo;document.getElementById('btnClaim').style.display='none';document.getElementById('adTimer').innerText=t+'s';let timer=setInterval(()=>{t--;document.getElementById('adTimer').innerText=t+'s';if(t<=0){clearInterval(timer);document.getElementById('adTimer').innerText='OK';document.getElementById('btnClaim').style.display='block';}},1000);}
function salvarComAnuncio(){document.getElementById('adSave').style.display='none';mostrarAnuncio('salvar',5);}
function pedirBanco(v,t){pendenteBanco=v;closeAll();mostrarAnuncio('banco',t);}
function recompensaLiberada(){document.getElementById('adModal').style.display='none';if(pendenteTipo=='salvar'){fame++;day++;check();novo();}if(pendenteTipo=='banco'){money+=pendenteBanco;check();}pendenteTipo=null;}
function aceitarPerda(){document.getElementById('adSave').style.display='none';money-=Math.floor(pendentePerda*0.5);pendentePerda=0;day++;check();novo();}
function check(){level=Math.floor(fame/3)+1;document.getElementById('day').innerText=day;document.getElementById('lvl').innerText=level;document.getElementById('money').innerText='R$'+money;document.getElementById('dolar').innerText=dolar;document.getElementById('patrao').innerText=getTitulo(level);}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>{if(m.id!=='loginModal')m.style.display='none';});}
function openBanco(){document.getElementById('bancoModal').style.display='flex';}
function openShop(){document.getElementById('shopModal').style.display='flex';}
function openMissoes(){document.getElementById('missoesModal').style.display='flex';}
function openDesafios(){document.getElementById('desafiosModal').style.display='flex';}
function openTitulos(){document.getElementById('titulosModal').style.display='flex';}
function openPix(){document.getElementById('pixModal').style.display='flex';}
function resetGameOver(){document.getElementById('gameOver').style.display='none';mostrarAnuncio('gameover',5);}
function restartFull(){money=500;day=1;fame=1;document.getElementById('gameOver').style.display='none';check();novo();}
</script>
</body>
</html>

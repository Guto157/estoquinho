<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEGA 1 PAGA 2 - JOGO DO AGIOTA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <h1>PEGA 1 PAGA 2 💰</h1>
  <p class="sub">Você é o agiota da quebrada</p>
  <div id="hud">
    <div>Dia <b id="day">1</b></div>
    <div id="caixa">R$ <b id="money">100</b></div>
    <div id="lives">❤️❤️❤️</div>
  </div>
  <div id="palco">
    <div id="agiota">🤑</div>
    <div id="bubble">E aí patrão, libera R$50?</div>
    <div id="cliente">😰</div>
    <h3 id="clienteNome">Beto da Laje</h3>
  </div>
  <div id="choices"></div>
  <button id="btnAd">📺 VER ANÚNCIO +R$100</button>
  <p class="foot">Recorde: <span id="rec">0</span> dias</p>
</div>
<script src="game.js"></script>
</body>
</html>

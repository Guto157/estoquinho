<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEGA 1 PAGA 2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0f0f0f;display:flex;justify-content:center}
#game{width:100%;max-width:420px;background:#FFF8E1;min-height:100vh;display:flex;flex-direction:column}
header{background:#111;color:#FFD600;padding:14px 16px;display:flex;justify-content:space-between}
.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px;background:#222}
.hud div{background:#111;border-radius:10px;padding:8px;color:#fff;text-align:center}
.hud b{color:#00FF88;display:block;font-size:18px}
#palco{padding:14px;text-align:center}
#wrap{display:flex;justify-content:center;gap:10px}
#cliente{width:80px;height:80px;background:#fff;border-radius:50%;border:3px solid #111;font-size:44px;display:flex;align-items:center;justify-content:center}
#agiota{width:110px;height:110px;background:url('agiota.png') center/contain no-repeat;background-color:transparent}
#bubble{background:#111;color:#fff;padding:12px;border-radius:14px;margin:10px auto;text-align:left}
#info{background:#fff;border:2px solid #111;border-radius:12px;padding:12px;margin-top:8px;text-align:left}
.btn{width:100%;padding:14px;border-radius:12px;border:3px solid #111;font-weight:900;font-size:15px;margin-top:10px;text-align:left}
.verde{background:#00E676} .amarelo{background:#FFD600} .preto{background:#111;color:#FFD600}
</style>
</head>
<body>
<div id="game">
<header><b style="color:#FFD600">PEGA 1 PAGA 2 💰</b><div style="color:#aaa;font-size:11px">DIA <span id="day" style="color:#fff">1</span>/30</div></header>
<div class="hud"><div>CAIXA<b id="money">R$100</b></div><div>FAMA<b id="fame" style="color:#FFD600">⭐1</b></div><div>VIDAS<b id="lives" style="color:#FF5252">❤️❤️❤️</b></div></div>
<div id="palco">
<div id="wrap"><div id="cliente">😰</div><div id="agiota"></div></div>
<div id="bubble" id="bubble">Bora fazer esse dinheiro render?</div>
<div id="info"><b id="nome">Beto</b> - <span id="risco">BAIXO</span><p id="hist" style="font-size:13px;margin-top:6px"></p><div style="display:flex;gap:6px;margin-top:8px;font-size:12px"><div style="flex:1;background:#FFF3B0;padding:6px;border-radius:6px;text-align:center">PEDE<b id="pede"></b></div><div style="flex:1;background:#FFF3B0;padding:6px;border-radius:6px;text-align:center">DEVOLVE<b id="devolve"></b></div><div style="flex:1;background:#FFF3B0;padding:6px;border-radius:6px;text-align:center">CHANCE<b id="chance"></b></div></div></div>
<div id="choices"></div>
<div style="display:flex;gap:6px;margin-top:10px"><button class="btn preto" style="flex:1;padding:8px;font-size:11px" onclick="verAd()">ANÚNCIO +80</button><button class="btn preto" style="flex:1;padding:8px;font-size:11px" onclick="capanga()">CAPANGA 200</button></div>
<div id="log" style="font-size:11px;text-align:left;margin-top:10px;color:#666"></div>
</div>
</div>
<script>
let day=1,money=100,fame=1,lives=3;
const clientes=[
{n:"Beto da Laje",e:"👷‍♂️",r:"BAIXO",c:85,p:50,d:100,h:"Pedreiro, mulher no hospital. Precisa de remédio. Todo mundo fala que é homem de palavra."},
{n:"Tia da Coxinha",e:"👩‍🍳",r:"BAIXO",c:80,p:80,d:140,h:"Geladeira queimou. Se não vender hoje, fica sem aluguel."},
{n:"Magrão da 12",e:"😎",r:"MÉDIO",c:55,p:100,d:250,h:"Vai fazer baile e lucrar. Mas já deve pra 3 agiotas."},
{n:"Nego do Corte",e:"💈",r:"ALTO",c:35,p:200,d:600,h:"Deve pra milícia. Se não pagar, a milícia vem atrás de VOCÊ."}
];
let cur;
function log(t){document.getElementById('log').innerHTML='> '+t+'<br>'+document.getElementById('log').innerHTML}
function novo(){
cur=clientes[Math.floor(Math.random()*clientes.length)];
document.getElementById('cliente').innerText=cur.e;
document.getElementById('nome').innerText=cur.n;
document.getElementById('risco').innerText=cur.r;
document.getElementById('hist').innerText=cur.h;
document.getElementById('pede').innerText='R$'+cur.p;
document.getElementById('devolve').innerText='R$'+cur.d;
document.getElementById('chance').innerText=cur.c+'%';
document.getElementById('bubble').innerText=cur.n+': "Patrão, libera pra mim?"';
let div=document.getElementById('choices'); div.innerHTML='';
let b1=document.createElement('button'); b1.className='btn verde'; b1.innerHTML='💸 EMPRESTAR R$'+cur.p+' → Recebe R$'+cur.d; b1.onclick=()=>jogar('normal');
let b2=document.createElement('button'); b2.className='btn amarelo'; b2.innerHTML='🔥 DOBRAR R$'+(cur.p*2)+' → Recebe R$'+(cur.d*2)+' (menos chance)'; b2.onclick=()=>jogar('dobro');
let b3=document.createElement('button'); b3.className='btn'; b3.style.background='#fff'; b3.innerHTML='❌ NEGAR - seguro'; b3.onclick=()=>jogar('negar');
let b4=document.createElement('button'); b4.className='btn preto'; b4.innerHTML='😈 JUROS ABUSIVO → Recebe R$'+(cur.d+100)+' (chance cai)'; b4.onclick=()=>jogar('juros');
div.appendChild(b1); div.appendChild(b2); div.appendChild(b3); div.appendChild(b4);
}
function jogar(t){
if(t=='negar'){log('Negou '+cur.n); day++; atualizar(); novo(); return}
let chance=cur.c; let pede=cur.p; let devolve=cur.d;
if(t=='dobro'){pede*=2; devolve*=2; chance-=15}
if(t=='juros'){devolve+=100; chance-=25}
let pagou=Math.random()*100 < chance;
if(pagou){money+=devolve-pede; fame++; log('✅ '+cur.n+' PAGOU R$'+devolve); document.getElementById('bubble').innerText='TÁ NA MÃO PATRÃO!'}
else{money-=pede; lives--; log('💀 CALOTE de '+cur.n+' -R$'+pede); document.getElementById('bubble').innerText='Foi mal patrão...'}
day++; atualizar(); if(lives>0 && money>0) novo(); 
}
function atualizar(){
document.getElementById('day').innerText=day;
document.getElementById('money').innerText='R$'+money;
document.getElementById('fame').innerText='⭐'+fame;
document.getElementById('lives').innerText='❤️'.repeat(lives);
if(day>30 || lives<=0 || money<=0){alert('Fim! R$'+money+' em '+day+' dias'); day=1; money=100; lives=3; fame=1}
}
function verAd(){money+=80; log('Anúncio +R$80'); atualizar()}
function capanga(){if(money>=200){money-=200; lives=3; log('Capanga: vidas restauradas'); atualizar()}else alert('Sem grana')}
novo(); atualizar();
</script>
</body>
</html>

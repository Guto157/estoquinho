<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoquinho - O Jogo do Fiado</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <h1>ESTOQUINHO 📒</h1>
  <div id="hud">
    <span>Dia: <b id="day">1</b></span>
    <span>Caixa: R$ <b id="money">0</b></span>
    <span>Vidas: <b id="lives">❤️❤️❤️</b></span>
  </div>
  <div id="clientArea">
    <div id="client">👨‍🌾</div>
    <div id="bubble">Oi, anota aí pra mim?</div>
  </div>
  <div id="notebook">
    <p>Cliente: <b id="clientName">-</b></p>
    <p>Fiado: R$ <b id="fiadoValue">?</b></p>
    <div id="choices"></div>
  </div>
  <div id="actions">
    <button id="btnAd">Ver anúncio e ganhar vida + R$10</button>
    <button id="btnRemoveAds">Tirar anúncios R$4,90 (PIX)</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
